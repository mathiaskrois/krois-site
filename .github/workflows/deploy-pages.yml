name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4
      - name: Read recorded releases
        id: releases
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {loadReleases} from './scripts/releases.mjs';
          const releases=await loadReleases();
          for (const [key,name] of [['unbound','unbound-web'],['wordwin','WordWin'],['dtu','dtu-courses']]) {
            appendFileSync(process.env.GITHUB_OUTPUT,`${key}_repo=${releases[name].repository}\n${key}_sha=${releases[name].commit}\n`);
          }
          JS
      - name: Check out Unbound website
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.releases.outputs.unbound_repo }}
          ref: ${{ steps.releases.outputs.unbound_sha }}
          path: sources/unbound-web
      - name: Check out WordWin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.releases.outputs.wordwin_repo }}
          ref: ${{ steps.releases.outputs.wordwin_sha }}
          path: sources/WordWin
      - name: Check out DTU course companion
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.releases.outputs.dtu_repo }}
          ref: ${{ steps.releases.outputs.dtu_sha }}
          path: sources/dtu-courses
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sources/unbound-web/package-lock.json
            sources/WordWin/package-lock.json
            sources/dtu-courses/package-lock.json
      - name: Build Unbound website
        working-directory: sources/unbound-web
        run: |
          npm ci
          npm run build
      - name: Verify and build WordWin
        working-directory: sources/WordWin
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify and build DTU companion
        working-directory: sources/dtu-courses
        run: |
          npm ci
          npm run test:dates
          npm run build
      - name: Assemble recorded website releases
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
